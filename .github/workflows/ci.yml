name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Test community governance migration backfill
        run: npm run test:governance-migration

      - name: Reapply Supabase migrations
        run: npm run supabase:reset

      - name: Test Supabase authorization
        run: npm run supabase:test

      - name: Test concurrent booking lifecycle transitions
        run: npm run test:db-concurrency

      - name: Test concurrent election writes and finalization
        run: npm run test:election-concurrency

      - name: Test concurrent governance transfer
        run: npm run test:governance-transfer-concurrency

      - name: Reset before isolated demo validation
        run: npm run supabase:reset

      - name: Load and verify local synthetic demo
        run: npm run demo:local

      - name: Test pilot metrics SQL
        run: npm run metrics:test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure local browser-safe Supabase values
        run: |
          eval "$(npx supabase status --output env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test critical browser journeys
        run: npm run test:e2e

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-diagnostics
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop
