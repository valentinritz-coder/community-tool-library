name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Reapply Supabase migrations
        run: npm run supabase:reset

      - name: Load and verify local synthetic demo
        run: npm run demo:local

      - name: Test Supabase authorization
        run: npm run supabase:test

      - name: Test concurrent booking lifecycle transitions
        run: npm run test:db-concurrency

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop
